name: sync
# Daily, before custos-server's advisory nightly (16:05 UTC) so a
# nightly that clones this mirror sees a same-day sync. Commits only
# when bytes moved (true since 2026-08-10 — syncdate.json now moves
# only with the data, so quiet days are zero-diff); the git history is
# the audit archive every pin record's commit hash points into.
#
# CAVEAT: with quiet days producing no commits, GitHub disables this
# schedule after 60 days without repo activity (it emails first). If
# that fires, re-enable via the Actions tab — and treat a long-quiet
# mirror as worth a look, not just a chore: the consumer records
# syncdate.json's synced_at in every pin, so staleness is visible
# downstream.
on:
  schedule:
    - cron: "35 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync upstream legs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/sync.py
      - name: Commit if changed
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git config user.name "custos-advisory-mirror sync"
          git config user.email "noreply@custos.invalid"
          git commit -m "sync: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
